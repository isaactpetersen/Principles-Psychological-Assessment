  title: "Principles of Psychological Assessment: With Applied Examples in R"
  subtitle: "Version 1.0.9"
  author:
    - name:
        given: Isaac T.
        family: Petersen
      url: https://psychology.uiowa.edu/people/isaac-petersen
      email: isaac-t-petersen@uiowa.edu
      phone: +1 (319) 467-1014
      degrees: PhD
      orcid: 0000-0003-3072-6673
      affiliations:
          name: University of Iowa
          department: Department of Psychological and Brain Sciences
          address: G60 Psychological and Brain Sciences Building
          city: Iowa City
          region: IA
          country: United States
          postal-code: 52242
          url: https://psychology.uiowa.edu
  date: today
  cover-image: images/cover.png
  cover-image-alt: "Principles of Psychological Assessment Book Cover"
  sharing: [twitter, facebook, linkedin]
  doi: 10.25820/work.007199
  isbn: "9780984037827"
  publisher: "University of Iowa Libraries"
  publisher-place: "Iowa City, IA."
  keyword: psychological assessment, R software, psychometrics, measurement, reliability, validity
  license: "CC BY"
  reader-mode: true
  page-footer:
    left: |
      "Principles of Psychological Assessment: With Applied Examples in R" was written by <a href="https://psychology.uiowa.edu/people/isaac-petersen">Isaac T. Petersen</a>.
    right: |
      This book was built with <a href="https://quarto.org/">Quarto</a>.
  favicon: images/logo.png
  twitter-card: true
  open-graph:
    locale: en_US
    site-name: "Principles of Psychological Assessment: With Applied Examples in R"
    image: images/open-graph.png
  site-url: https://isaactpetersen.github.io/Principles-Psychological-Assessment
  repo-url: https://github.com/isaactpetersen/Principles-Psychological-Assessment
  repo-branch: main
  repo-actions: [edit, source, issue]
  google-analytics: G-WZJ45RB1K4
  chapters:
    - index.qmd
    - part: "Part I"
    - intro.qmd
    - scores-scales.qmd
    - constructs.qmd
    - reliability.qmd
    - validity.qmd
    - generalizability-theory.qmd
    - structural-equation-modeling.qmd
    - item-response-theory.qmd
    - prediction.qmd
    - clinical-actuarial-judgment.qmd
    - clinical-assessment.qmd
    - evidence-based-assessment.qmd
    - ethics.qmd
    - factor-analysis-pca.qmd
    - part: "Part II"
    - intellectual-assessment.qmd
    - test-bias.qmd
    - interview-dsm.qmd
    - objective-personality-testing.qmd
    - projective-personality-testing.qmd
    - psychophysiological-measures.qmd
    - computerized-adaptive-testing.qmd
    - behavioral-assessment.qmd
    - repeated-assessments.qmd
    - cognitive-assessment.qmd
    - diversity.qmd
    - references.qmd

lang: en-US
bibliography: [references.bib, packages.bib]
csl: apa.csl

format:
  html:
    highlight-style: a11y
    theme:
      light: [cosmo, fonts/css/lora.css]
      dark: [cosmo, fonts/css/lora.css, theme-dark.scss]
    mainfont: Lora #gfonts::setup_font("lora", output_dir = "./fonts/"); gfonts::get_all_fonts()
    code-link: true
    number-sections: true
    code-fold: show
    code-line-numbers: true
    toc: true
    toc-depth: 5
    keep-md: true
    link-external-newwindow: true
    embed-resources: false
    anchor-sections: true
    df-print: paged
    comments:
      hypothesis:
        theme: classic
        openSidebar: false
        showHighlights: whenSidebarOpen
      giscus:
        repo: isaactpetersen/Principles-Psychological-Assessment
        repo-id: MDEwOlJlcG9zaXRvcnkzNzIwMjExNjg=
        category: Chapter Comments
        category-id: DIC_kwDOFiyXsM4CzZAv
        mapping: pathname
        reactions-enabled: false
        loading: lazy
        input-position: top
    #include-in-header:
    #  - "includes/google_analytics.html"
    include-before-body:
      - "includes/open-review.html"
    include-after-body:
    #  - "includes/disqus.html"
      - "includes/email_submit.html"
    #  - "includes/footer.html"
    license: CC BY
    author-meta: "Isaac T. Petersen"
    date-meta: today
    email-obfuscation: javascript
    axe: true
    keep-md: true
  pdf:
    documentclass: krantz
    classoption: krantz2
    #pdf-standard: ua-2
    link-citations: true
    colorlinks: true
    keep-tex: true
    lot: true
    lof: true
    include-in-header: latex/preamble.tex
    include-before-body: latex/before_body.tex
    include-after-body: latex/after_body.tex
    cite-method: biblatex
    biblatexoptions:
      - "backend=biber"
      - "backref=true"
      - "style=apa"
      - "language=american"
  epub:
    toc: true

execute:
  error: true
  message: false
  warning: false

lightbox:
  match: auto
